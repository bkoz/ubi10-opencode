apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: my-sandbox
spec:
  podTemplate:
    spec:
      containers:
      - name: my-container
        # image: quay.io/marcocaimi/opencode-web-ocp:latest
        image: quay.io/bkozdemb/hello:latest
        env:
          - name: INFERENCE_ENDPOINT
            value: "https://openai.com"
          - name: MODEL_NAME
            value: "openai/gpt-4o"
